spring.application.name=good-tashu

spring.config.import=\
  file:backend-local.env[.properties],\
  file:backend/good-tashu/backend-local.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DATABASE}?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.jpa.hibernate.ddl-auto=update

firebase.key.path=firebase/fcm-key.json

# ?? ???
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_REST_API_KEY}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/api/auth/oauth/callback/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# jwt
good-tashu.jwt.secret=${JWT_SECRET_BASE64}
good-tashu.jwt.issuer=good-tashu
good-tashu.jwt.audience=good-tashu-api
good-tashu.jwt.client-id=good-tashu-web
good-tashu.jwt.access-token-expires=${JWT_ACCESS_TOKEN_EXPIRES}
good-tashu.jwt.refresh-token-expires=${JWT_REFRESH_TOKEN_EXPIRES}

# ?? ??? ??? ??? ??? ???? ? ????? ???? ??????
good-tashu.oauth2.success-url=${FRONTEND_OAUTH_SUCCESS_URL:http://localhost:5173/}
good-tashu.oauth2.failure-url=${FRONTEND_OAUTH_FAILURE_URL:http://localhost:5173/login}

