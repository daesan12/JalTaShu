<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget=resizes-content: 키보드가 올라오면 화면을 줄여서
         하단 고정 요소(바텀시트·버튼)가 키보드에 가려지지 않게 한다 (Android Chrome/WebView) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#4c8a12" />
    <title>잘타슈</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
