server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # Directory fallbacks can collide with React routes such as /install.
        try_files $uri /index.html;
    }
}
