name: tashu-ai-serving

services:
  ai-serving:
    image: ${AI_SERVING_IMAGE:?set AI_SERVING_IMAGE to an immutable ECR image}
    pull_policy: never
    container_name: tashu-ai-serving
    restart: unless-stopped
    env_file:
      - ${AI_DB_ENV_FILE:-/etc/tashu/ai-serving/mysql-reader.env}
      - ${AI_REDIS_ENV_FILE:-/etc/tashu/ai-serving/redis.env}
    volumes:
      - ${AI_MODEL_DIR:-/srv/tashu/ai-serving/models}:/workspace/artifacts/models:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -r /workspace/artifacts/models/lgbm_lambda.joblib
          && test -r /workspace/artifacts/models/lgbm_mu.joblib
          && test -r /workspace/artifacts/models/station_profile.parquet
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 1.00
