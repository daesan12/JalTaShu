name: tashu-database

services:
  mysql:
    image: mysql:8.4.11
    container_name: tashu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: UTC
    secrets:
      - mysql_root_password
    ports:
      - 127.0.0.1:3306:3306
      # Server B의 Spark만 사설망으로 접근한다. UFW에서도 Server B 한 대만 허용한다.
      - 172.26.8.114:3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./conf.d/tashu.cnf:/etc/mysql/conf.d/tashu.cnf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysqladmin ping --host=127.0.0.1 --user=root --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    cpus: 2.0
    mem_limit: 4g

secrets:
  mysql_root_password:
    file: ${MYSQL_SECRET_DIR:-/etc/tashu/mysql}/root-password

volumes:
  mysql-data:
    name: tashu-mysql-data

networks:
  default:
    name: tashu-app
