name: tashu-spark-benchmark-worker

services:
  benchmark-worker-a:
    image: spark:4.1.3-scala2.13-java21-python3-ubuntu@sha256:a7b323f4557eab1dce6e2242346560cd52a0bd0f9c32cdac60eea6d709eb05ba
    container_name: tashu-spark-benchmark-worker-a
    user: "185:185"
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Seoul
    volumes:
      - /srv/tashu/data/spark-benchmark/work:/opt/spark/work
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --host
      - ${SPARK_WORKER_HOST:?set SPARK_WORKER_HOST to Server A private IP}
      - --port
      - "17079"
      - --cores
      - "2"
      - --memory
      - 3g
      - --webui-port
      - "18183"
      - spark://${SPARK_MASTER_HOST:?set SPARK_MASTER_HOST to Server B private IP}:17077
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/18183'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    mem_limit: 4g
    cpus: 2.0
