jenkins:
  systemMessage: "Tashu Jenkins Controller - builds run only on agents"
  numExecutors: 0
  mode: EXCLUSIVE

  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
        - id: "admin"
          name: "Tashu Administrator"
          password: "${jenkins_admin_password}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  crumbIssuer:
    standard: {}

  nodes:
    - permanent:
        name: "docker-build-agent"
        nodeDescription: "Server B Docker build agent"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "docker linux server-b-heavy"
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "agent"
            port: 22
            credentialsId: "tashu-build-agent-ssh"
            javaPath: "/opt/java/openjdk/bin/java"
            jvmOptions: "-Xms128m -Xmx512m"
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 15
            sshHostKeyVerificationStrategy:
              manuallyProvidedKeyVerificationStrategy:
                key: "${jenkins_agent_host_key}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "tashu-build-agent-ssh"
              username: "jenkins"
              description: "SSH key used only between Jenkins Controller and Build Agent"
              privateKeySource:
                directEntry:
                  privateKey: "${jenkins_agent_private_key}"
          - usernamePassword:
              scope: GLOBAL
              id: "gitlab-readonly"
              username: "${gitlab_username}"
              password: "${gitlab_token}"
              description: "GitLab read-only deploy token for S15P21B103"

unclassified:
  location:
    url: "http://localhost:8080/"
