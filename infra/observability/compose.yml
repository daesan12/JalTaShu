services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: tashu-node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: tashu-prometheus
    network_mode: host
    restart: unless-stopped
    depends_on:
      - node-exporter
    extra_hosts:
      - tashu-server-a:${SERVER_A_PRIVATE_IP}
      - tashu-server-b:${SERVER_B_PRIVATE_IP}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1G

  loki:
    image: grafana/loki:3.7.5
    container_name: tashu-loki
    network_mode: host
    restart: unless-stopped
    environment:
      SERVER_B_PRIVATE_IP: ${SERVER_B_PRIVATE_IP}
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1G

  grafana:
    image: grafana/grafana:13.2.1
    container_name: tashu-grafana
    network_mode: host
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    extra_hosts:
      - tashu-server-b:${SERVER_B_PRIVATE_IP}
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: '3000'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_LOG_MODE: console
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

secrets:
  grafana_admin_password:
    file: /etc/tashu-observability/grafana-admin-password

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
