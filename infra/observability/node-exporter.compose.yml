services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: tashu-node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=${NODE_EXPORTER_LISTEN_ADDRESS}:9100
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: tashu-alloy
    network_mode: host
    restart: unless-stopped
    group_add:
      - '999'
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

volumes:
  alloy-data:
